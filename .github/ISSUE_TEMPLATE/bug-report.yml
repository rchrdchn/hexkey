name: Feedback / bug report
description: Something broken, confusing, or a step that looks wrong? Tell us.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: where
    attributes: { label: Where, description: "Piece and step, e.g. BILLY step 7, or the page URL", placeholder: "https://hexkey.pages.dev/#/billy/7" }
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What did you expect instead? }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Device and browser, placeholder: "iPhone 15, Safari 18" }
  - type: textarea
    id: extra
    attributes: { label: Anything else, description: Screenshots of Hexkey are welcome. Please don't attach pages from IKEA manuals. }
